# Formatting is mechanical: run `cargo fmt --all` before every commit. CI runs `cargo fmt --check`.
# Only stable rustfmt options are used so the config works on the pinned stable toolchain.
edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
match_block_trailing_comma = true
fn_call_width = 80
