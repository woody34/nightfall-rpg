syntax = "proto3";

package nightfall.v1;

import "nightfall/v1/game.proto";

// Real-time channel envelopes (Phase 0 §3.2). These are NOT gRPC messages: one ClientMessage
// or ServerMessage is sent per binary WebSocket frame on GET /ws. The play ticket goes in the
// upgrade request's `Authorization: Bearer <ticket>` header, never the URL. Handshake statuses
// and close codes: docs/engineering/api-guidelines.md, "Real-time channel".
//
// Resource limits enforced per session by the server (Phase 0b plan §8 item 12):
//   * max frame size:           4096 bytes; larger frames are rejected before decoding.
//   * rate limit:               30 frames per second per session (token bucket); excess
//                               intents are answered with IntentRejected{RATE_LIMITED}.
//   * idle timeout:             60 s without any inbound frame closes the socket. Clients
//                               that cannot send WebSocket pings keep an idle session open
//                               with a ClientMessage carrying a fresh seq and no intent; it
//                               is answered with IntentRejected{INVALID} and changes nothing.
//   * per-tick command budget:  8 commands per session per tick; the excess is deferred to
//                               the next tick in order (and is therefore Acked with a later
//                               `tick`).
//
// Time: the zone runs a fixed 100 ms tick. `server_time_ms = time_origin_ms + tick * 100`;
// it is derived from the tick, never read from a clock, so replays are byte-identical.
//
// The Unreal client encodes them with generated code (apps/client-unreal/Scripts/gen-proto.sh).
// Never renumber; reserve removed fields.

// Client-to-server envelope. Exactly one intent is set; a frame with none set is answered
// with IntentRejected{INVALID}.
message ClientMessage {
  uint32 seq = 1;                       // echoed in Ack; monotonically increasing per session
  oneof intent {
    MoveToRequest move_to = 10;
    StopMoveRequest stop_move = 11;
    SetTargetRequest set_target = 12; // select or clear the session actor's target
    AttackRequest attack = 13;       // enable auto-attack on the current target
    StopAttackRequest stop_attack = 14; // disable auto-attack
    RespawnRequest respawn = 15;     // request town respawn for the session actor
  }
}

// Walk to `destination`. Answered by exactly one Ack or one IntentRejected with the same
// `seq`. Rejections: OUT_OF_BOUNDS (outside the zone or non-finite), INVALID.
message MoveToRequest {
  Position destination = 1;             // tile units
}

// Stop moving. Clears the entity's destination; the entity then emits one final EntityMove
// with `destination` zero and `speed` zero. Stopping an already stationary entity is
// accepted (Ack) and emits no event.
message StopMoveRequest {}

// Select a live attackable NPC in the actor's 3x3-cell AOI; players cannot attack players.
// Repeating the same selection is a no-op. Clearing/changing cancels a pending swing.
// Rejections: INVALID (malformed UUID), UNKNOWN_ENTITY, DEAD_ACTOR,
// NON_ATTACKABLE_TARGET (including dead target), TARGET_NOT_IN_AOI.
message SetTargetRequest {
  string entity_id = 1; // target UUID; empty clears selection (nullable target)
}

// Enable auto-attack on the current target, chase into melee range, then repeat.
// Repeated enables with a fresh seq must not reset cooldown or create an extra swing.
// Actor identity is supplied by the session. Attack ends the actor's respawn protection.
// Rejections: UNKNOWN_ENTITY (no or vanished target), DEAD_ACTOR, NON_ATTACKABLE_TARGET,
// TARGET_NOT_IN_AOI, PROTECTED. MoveTo/StopMove/target change end the attack.
message AttackRequest {}

// Disable auto-attack and cancel the pending swing; repeated stops are a no-op.
// Rejections: DEAD_ACTOR.
message StopAttackRequest {}

// Respawn a dead actor at the town safe point: floor(65% maxHP), minimum 1 HP, MP 0,
// protection for 6000 ticks (600 s) that an accepted Attack ends early. A living actor is
// refused with INVALID ("the actor is alive and cannot respawn"), so a repeat never revives
// twice; respawn refunds no XP.
message RespawnRequest {}

// Server-to-client envelope. Per session the server emits one ordered stream of Acks,
// rejections and world events.
message ServerMessage {
  oneof payload {
    Ack ack = 1;
    WorldEvent event = 2;
    IntentRejected rejected = 3;
  }
}

// The intent with this `seq` was ACCEPTED and applied on tick `tick`. The Ack is sent with
// that tick's output, ahead of its world events. An idempotent no-op has no event.
// An accepted intent is never later rejected.
message Ack {
  uint32 seq = 1;
  uint64 tick = 2;                      // tick on which the intent is applied
}

// The intent with this `seq` was REJECTED and will never be applied. The session stays open.
// Exactly one of Ack or IntentRejected is sent per intent.
message IntentRejected {
  uint32 seq = 1;
  RejectReason reason = 2;
  string detail = 3;                    // human-readable, for logs; not for branching
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_OUT_OF_BOUNDS = 1;      // destination outside the zone or not finite
  REJECT_REASON_TOO_FAR = 2;            // destination beyond the allowed move distance
  REJECT_REASON_UNKNOWN_ENTITY = 3;     // actor or selected target is not (or no longer) in the zone
  REJECT_REASON_OVERLOADED = 4;         // server-side queue full; retry later
  REJECT_REASON_RATE_LIMITED = 5;       // more than 30 frames/s on this session
  REJECT_REASON_INVALID = 6;            // malformed: no intent set, oversize, bad field
  REJECT_REASON_DEAD_ACTOR = 7; // the actor is dead and cannot perform this intent
  REJECT_REASON_NON_ATTACKABLE_TARGET = 8; // target is dead, a player, or a noncombat NPC
  REJECT_REASON_TARGET_NOT_IN_AOI = 9; // existing target is outside the actor's 3x3-cell AOI
  REJECT_REASON_OUT_OF_RANGE = 10; // target is outside melee range at impact; distinct from move TOO_FAR
  REJECT_REASON_PROTECTED = 11; // target has active respawn protection
  REJECT_REASON_NOT_YET_IMPLEMENTED = 12; // intent recorded, but its behaviour is not implemented yet (unused since E2.4)

}

message WorldEvent {
  oneof event {
    EntitySpawn spawn = 1;
    EntityMove move = 2;
    EntityDespawn despawn = 3;
    AttackResult attack_result = 4; // authoritative combat fact
    EntityDied entity_died = 5; // authoritative combat fact
    EntityRespawned entity_respawned = 6; // authoritative combat fact
    StatsChanged stats_changed = 7; // authoritative combat fact
    XpGained xp_gained = 8; // authoritative combat fact
    LevelUp level_up = 9; // authoritative combat fact
    TargetChanged target_changed = 10; // authoritative combat fact
    AttackStarted attack_started = 11; // a swing started; lands at impact_tick
    AttackCancelled attack_cancelled = 12; // a pending swing ended without impact
    ClassChanged class_changed = 13;
  }
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
}

// An entity entered the receiving session's area of interest (or the zone, or was replaced).
message EntitySpawn {
  string entity_id = 1;
  string name = 2;
  Position position = 3;
  EntityKind kind = 4;
  // Generation of the account session that owns this entity. A new admission for an account
  // bumps it; a spawn with a higher generation replaces any earlier entity of that account,
  // and anything stamped with a lower generation is stale and must be discarded.
  uint32 session_generation = 5;
  // Combat state for AOI entry (absent fields = noncombat entity): public HP, life and any
  // swing already in flight. MP and XP are owner-only (StatsChanged / XpGained).
  bool combatant = 6;                   // true when the fields below are meaningful
  string template_id = 7;               // NPC template; empty for players
  uint32 life_incarnation = 8;          // NPC life counter; a respawn increments it
  bool dead = 9;
  bool attackable = 10;                 // the receiver may SetTarget it
  uint32 hp = 11;
  uint32 max_hp = 12;
  uint32 level = 13;
  AttackStarted pending_swing = 14;     // set while a swing is in flight
  Race race = 15;
  uint32 class_id = 16;
  Sex sex = 17;
  uint32 hair_style = 18;
  uint32 hair_color = 19;
  uint32 face = 20;
  uint64 state_tick = 21;
}

message EntityMove {
  string entity_id = 1;
  Position position = 2;                // where the entity is at server_time_ms
  Position destination = 3;             // where it is heading (zero when stopped)
  float speed = 4;                      // tiles per second
  int64 server_time_ms = 5;             // authoritative timestamp for interpolation;
                                        // = time_origin_ms + tick * 100
  uint64 tick = 6;                      // zone tick this state is valid at
}

message EntityDespawn {
  string entity_id = 1;
}

// Physical attack outcome; a miss consumes no crit or damage-spread roll.
enum AttackOutcome {
  ATTACK_OUTCOME_UNSPECIFIED = 0;
  ATTACK_OUTCOME_MISS = 1;
  ATTACK_OUTCOME_HIT = 2;
  ATTACK_OUTCOME_CRIT = 3;
}

// Authoritative attack result fact; responses precede facts, spawns precede references.
message AttackResult {
  string attacker = 1; // attacker UUID
  string target = 2; // target UUID
  uint64 tick = 3; // impact tick; 100 ms per tick
  AttackOutcome outcome = 4; // MISS, HIT or CRIT; UNSPECIFIED is invalid
  uint32 damage = 5; // whole HP removed; zero on MISS
  uint32 target_hp_after = 6; // authoritative remaining whole HP after impact
  uint32 target_incarnation = 7; // the target life the swing landed on
}

// Authoritative entity died fact; responses precede facts, spawns precede references.
message EntityDied {
  string entity = 1; // dead entity UUID
  uint64 tick = 2; // death tick
  string killer = 3; // killing entity UUID; empty if no killer
  uint32 incarnation = 4; // the life that ended
}

// A swing started at `tick`; it lands at `impact_tick` unless an AttackCancelled follows,
// and the attacker's next swing may start at `ready_tick`. Animations wind up before impact.
message AttackStarted {
  string attacker = 1;
  string target = 2;
  uint64 tick = 3;
  uint64 impact_tick = 4;
  uint64 ready_tick = 5;
  uint32 target_incarnation = 6;
}

enum SwingCancelReason {
  SWING_CANCEL_REASON_UNSPECIFIED = 0;
  SWING_CANCEL_REASON_STOPPED = 1;        // StopAttack
  SWING_CANCEL_REASON_TARGET_CHANGED = 2; // selection changed or cleared
  SWING_CANCEL_REASON_MOVED = 3;          // MoveTo / StopMove
  SWING_CANCEL_REASON_OUT_OF_RANGE = 4;   // target outside reach at impact
  SWING_CANCEL_REASON_TARGET_LOST = 5;    // target died, left or became protected
  SWING_CANCEL_REASON_ATTACKER_DIED = 6;  // attacker died or left
}

// A pending swing ended without an impact; no damage, no roll.
message AttackCancelled {
  string attacker = 1;
  string target = 2;
  uint64 tick = 3;
  SwingCancelReason reason = 4;
}

// Authoritative entity respawned fact; responses precede facts, spawns precede references.
message EntityRespawned {
  string entity = 1; // respawned entity UUID
  uint64 tick = 2; // respawn tick
  Position position = 3; // authoritative safe point in tile units
  uint32 hp = 4; // restored whole HP
  uint32 incarnation = 5; // the new life; facts about older lives are stale
}

// Authoritative stats changed fact; responses precede facts, spawns precede references.
message StatsChanged {
  string entity = 1; // owner UUID; this event is owner-only (MP is private)
  uint32 hp = 2; // current whole HP, zero when dead
  uint32 max_hp = 3; // maximum whole HP
  uint32 mp = 4; // current whole MP
  uint32 max_mp = 5; // maximum whole MP
  uint32 level = 6; // current level, including decreases after death
  uint64 xp = 7; // cumulative whole XP, including death loss (owner-only)
  uint32 cp = 8;
  uint32 max_cp = 9;
  uint32 class_id = 10;
  uint64 sp = 11;
  uint32 token_tier_1_count = 12;
  uint32 token_tier_2_count = 13;
  uint64 tick = 14;
}

// Authoritative xp gained fact; responses precede facts, spawns precede references.
message XpGained {
  string entity = 1; // owner UUID; this event is owner-only
  uint64 amount = 2; // whole XP actually awarded after the level-85 cap
  uint64 total = 3; // authoritative cumulative whole XP after award
}

// Authoritative level up fact; responses precede facts, spawns precede references.
message LevelUp {
  string entity = 1; // levelled entity UUID
  uint32 level = 2; // newly attained level; one event per crossed threshold
}

// Authoritative target changed fact; responses precede facts, spawns precede references.
message TargetChanged {
  string entity = 1; // selecting actor UUID; owner-only
  string target = 2; // selected target UUID; empty means cleared
}

// Authoritative class change visible to the character's area of interest.
message ClassChanged {
  string entity = 1;
  uint32 class_id = 2;
  uint64 tick = 3;
  uint32 session_generation = 4;
}
