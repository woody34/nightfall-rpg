syntax = "proto3";

package nightfall.v1;

import "nightfall/v1/economy.proto";
import "nightfall/v1/game.proto";
import "nightfall/v1/items.proto";

// Real-time channel envelopes (Phase 0 §3.2). These are NOT gRPC messages: one ClientMessage
// or ServerMessage is sent per binary WebSocket frame on GET /ws. The play ticket goes in the
// upgrade request's `Authorization: Bearer <ticket>` header, never the URL. Handshake statuses
// and close codes: docs/engineering/api-guidelines.md, "Real-time channel".
//
// Resource limits enforced per session by the server (Phase 0b plan §8 item 12):
//   * max frame size:           4096 bytes; larger frames are rejected before decoding.
//   * rate limit:               30 frames per second per session (token bucket); excess
//                               intents are answered with IntentRejected{RATE_LIMITED}.
//   * idle timeout:             60 s without any inbound frame closes the socket. Clients
//                               that cannot send WebSocket pings keep an idle session open
//                               with a ClientMessage carrying a fresh seq and no intent; it
//                               is answered with IntentRejected{INVALID} and changes nothing.
//   * per-tick command budget:  8 commands per session per tick; the excess is deferred to
//                               the next tick in order (and is therefore Acked with a later
//                               `tick`).
//
// Time: the zone runs a fixed 100 ms tick. `server_time_ms = time_origin_ms + tick * 100`;
// it is derived from the tick, never read from a clock, so replays are byte-identical.
//
// The Unreal client encodes them with generated code (apps/client-unreal/Scripts/gen-proto.sh).
// Never renumber; reserve removed fields.

// Client-to-server envelope. Exactly one intent is set; a frame with none set is answered
// with IntentRejected{INVALID}.
message ClientMessage {
  uint32 seq = 1;                       // echoed in Ack; monotonically increasing per session
  oneof intent {
    MoveToRequest move_to = 10;
    StopMoveRequest stop_move = 11;
    SetTargetRequest set_target = 12; // select or clear the session actor's target
    AttackRequest attack = 13;       // enable auto-attack on the current target
    StopAttackRequest stop_attack = 14; // disable auto-attack
    RespawnRequest respawn = 15;     // request town respawn for the session actor
    CastSkillRequest cast_skill = 16;
    CancelCastRequest cancel_cast = 17;
    AcceptResurrectRequest accept_resurrect = 18;
    EquipItemRequest equip_item = 19;
    UnequipItemRequest unequip_item = 20;
    UseItemRequest use_item = 21;
    DestroyItemRequest destroy_item = 22;
    EnchantItemRequest enchant_item = 23;
    ToggleAutoShotRequest toggle_auto_shot = 24;
    RefineItemRequest refine_item = 25;
    CancelRefineRequest cancel_refine = 26;
    ExchangeSpecialAbilityRequest exchange_special_ability = 27;
    CrystallizeItemRequest crystallize_item = 28;
    // Phase 5 economy intents (economy.proto; phase-5-zone-design.md §13.1). Sow and Harvest
    // use the existing use_item = 21.
    PickUpItemRequest pick_up_item = 29;
    VendorBuyRequest vendor_buy = 30;
    VendorSellRequest vendor_sell = 31;
    VendorRefundRequest vendor_refund = 32;
    MultisellChooseRequest multisell_choose = 33;
    RegisterRecipeRequest register_recipe = 34;
    DeleteRecipeRequest delete_recipe = 35;
    CraftItemRequest craft_item = 36;
    TradeRequestRequest trade_request = 37;
    TradeAnswerRequest trade_answer = 38;
    TradeAddItemRequest trade_add_item = 39;
    TradeConfirmRequest trade_confirm = 40;
    TradeCancelRequest trade_cancel = 41;
    SetPrivateStoreSellRequest set_private_store_sell = 42;
    SetPrivateStoreBuyRequest set_private_store_buy = 43;
    SetPrivateManufactureRequest set_private_manufacture = 44;
    ClosePrivateStoreRequest close_private_store = 45;
    PrivateStoreBuyRequest private_store_buy = 46;
    PrivateStoreSellRequest private_store_sell = 47;
    PrivateManufactureOrderRequest private_manufacture_order = 48;
    PartyInviteRequest party_invite = 49;
    PartyAnswerRequest party_answer = 50;
    PartyLeaveRequest party_leave = 51;
    PartyKickRequest party_kick = 52;
    PartyChangeLeaderRequest party_change_leader = 53;
    PartyLootChangeRequest party_loot_change_request = 54;
    PartyLootChangeAnswer party_loot_change_answer = 55;
    WarehouseDepositRequest warehouse_deposit = 56;
    WarehouseWithdrawRequest warehouse_withdraw = 57;
    FreightSendRequest freight_send = 58;
    FreightWithdrawRequest freight_withdraw = 59;
    MailSendRequest mail_send = 60;
    MailTakeAttachmentsRequest mail_take_attachments = 61;
    MailRejectRequest mail_reject = 62;
    MailCancelRequest mail_cancel = 63;
    MailDeleteRequest mail_delete = 64;
    ManorBuySeedRequest manor_buy_seed = 65;
    ManorSellCropRequest manor_sell_crop = 66;
    ItemAuctionBidRequest item_auction_bid = 67;
    ItemAuctionCancelBidRequest item_auction_cancel_bid = 68;
    MailMarkReadRequest mail_mark_read = 69; // E31
  }
}

// Walk to `destination`. Answered by exactly one Ack or one IntentRejected with the same
// `seq`. Rejections: OUT_OF_BOUNDS (outside the zone or non-finite), INVALID.
message MoveToRequest {
  Position destination = 1;             // tile units
}

// Stop moving. Clears the entity's destination; the entity then emits one final EntityMove
// with `destination` zero and `speed` zero. Stopping an already stationary entity is
// accepted (Ack) and emits no event.
message StopMoveRequest {}

// Select a live eligible NPC or another live player in the actor's AOI in Phase 3.
// Legacy epochs permit NPC selection only; selection itself is not hostility.
// Repeating the same selection is a no-op. Clearing/changing cancels a pending swing.
// Rejections: INVALID (malformed UUID), UNKNOWN_ENTITY, DEAD_ACTOR,
// NON_ATTACKABLE_TARGET (including dead target), TARGET_NOT_IN_AOI.
message SetTargetRequest {
  string entity_id = 1; // target UUID; empty clears selection (nullable target)
}

// Enable auto-attack on the current target, chase into melee range, then repeat.
// Repeated enables with a fresh seq must not reset cooldown or create an extra swing.
// Actor identity is supplied by the session. Attack ends the actor's respawn protection.
// Rejections: UNKNOWN_ENTITY (no or vanished target), DEAD_ACTOR, NON_ATTACKABLE_TARGET,
// TARGET_NOT_IN_AOI, PROTECTED, PEACE_ZONE (Phase 3). MoveTo/StopMove/target change end the attack.
message AttackRequest {}

// Disable auto-attack and cancel the pending swing; repeated stops are a no-op.
// Rejections: DEAD_ACTOR.
message StopAttackRequest {}

// Respawn a dead actor at the town safe point: floor(65% maxHP), minimum 1 HP, MP 0,
// protection for 6000 ticks (600 s) that an accepted Attack ends early. A living actor is
// refused with INVALID ("the actor is alive and cannot respawn"), so a repeat never revives
// twice; respawn refunds no XP.
message RespawnRequest {}

// Cast the learned rank; the session supplies the actor. No client rank, costs or timing.
// Absent/empty target captures selection at this command; SELF ignores selection.
// Rejections: INVALID (bad UUID/zero skill), DEAD_ACTOR, UNKNOWN_ENTITY,
// TARGET_NOT_IN_AOI, OUT_OF_RANGE, PROTECTED, SKILL_UNKNOWN, SKILL_NOT_LEARNED,
// SKILL_COOLDOWN, INSUFFICIENT_MP, INSUFFICIENT_HP, ALREADY_CASTING, INCAPACITATED,
// SILENCED, INVALID_TARGET_TYPE, PEACE_ZONE, WEAPON_CONDITION, NOT_YET_IMPLEMENTED
// (deferred skill/legacy epoch). Once Acked, failures emit SkillCastCancelled, not rejection.
message CastSkillRequest {
  uint32 skill_id = 1;
  optional string target = 2;
}

// Cancel without refunding MP1 or reuse. Idle is an accepted no-op.
// A supplied stale cast_id cannot cancel a newer cast. Rejections: DEAD_ACTOR, INVALID.
message CancelCastRequest {
  optional uint64 cast_id = 1;
}

// Accept or decline the first live offer for this death incarnation. Allowed while dead.
// Rejections: NO_RESURRECT_OFFER (stale, expired, consumed or wrong life), INVALID (zero id).
message AcceptResurrectRequest {
  uint64 offer_id = 1;
  bool accept = 2;
}

// Server-to-client envelope. Per session the server emits one ordered stream of Acks,
// rejections and world events.
message ServerMessage {
  oneof payload {
    Ack ack = 1;
    WorldEvent event = 2;
    IntentRejected rejected = 3;
  }
}

// The intent with this `seq` was ACCEPTED and applied on tick `tick`. The Ack is sent with
// that tick's output, ahead of its world events. An idempotent no-op has no event.
// An accepted intent is never later rejected.
message Ack {
  uint32 seq = 1;
  uint64 tick = 2;                      // tick on which the intent is applied
}

// The intent with this `seq` was REJECTED and will never be applied. The session stays open.
// Exactly one of Ack or IntentRejected is sent per intent.
message IntentRejected {
  uint32 seq = 1;
  RejectReason reason = 2;
  string detail = 3;                    // human-readable, for logs; not for branching
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_OUT_OF_BOUNDS = 1;      // destination outside the zone or not finite
  REJECT_REASON_TOO_FAR = 2;            // destination beyond the allowed move distance
  REJECT_REASON_UNKNOWN_ENTITY = 3;     // actor or selected target is not (or no longer) in the zone
  REJECT_REASON_OVERLOADED = 4;         // server-side queue full; retry later
  REJECT_REASON_RATE_LIMITED = 5;       // more than 30 frames/s on this session
  REJECT_REASON_INVALID = 6;            // malformed: no intent set, oversize, bad field
  REJECT_REASON_DEAD_ACTOR = 7; // the actor is dead and cannot perform this intent
  REJECT_REASON_NON_ATTACKABLE_TARGET = 8; // target is dead, a player, or a noncombat NPC
  REJECT_REASON_TARGET_NOT_IN_AOI = 9; // existing target is outside the actor's 3x3-cell AOI
  REJECT_REASON_OUT_OF_RANGE = 10; // target is outside melee range at impact; distinct from move TOO_FAR
  REJECT_REASON_PROTECTED = 11; // target has active respawn protection
  REJECT_REASON_NOT_YET_IMPLEMENTED = 12; // deferred skill capability or intent unavailable in this epoch
  REJECT_REASON_SKILL_UNKNOWN = 13; // no such skill definition
  REJECT_REASON_SKILL_NOT_LEARNED = 14; // actor has not learned the skill
  REJECT_REASON_SKILL_COOLDOWN = 15; // reuse deadline has not passed
  REJECT_REASON_INSUFFICIENT_MP = 16; // insufficient MP for start precheck
  REJECT_REASON_INSUFFICIENT_HP = 17; // insufficient HP for skill cost
  REJECT_REASON_ALREADY_CASTING = 18; // actor already has a cast in flight
  REJECT_REASON_INCAPACITATED = 19; // status prevents acting
  REJECT_REASON_SILENCED = 20; // status prevents this skill type
  REJECT_REASON_INVALID_TARGET_TYPE = 21; // target fails skill type/life constraints
  REJECT_REASON_PEACE_ZONE = 22; // hostility is forbidden at either endpoint
  REJECT_REASON_WEAPON_CONDITION = 23; // equipped weapon fails skill condition
  REJECT_REASON_NO_RESURRECT_OFFER = 24; // offer is absent, stale, expired or consumed
  REJECT_REASON_ITEM_NOT_OWNED = 25;
  REJECT_REASON_ITEM_NOT_USABLE = 26;
  REJECT_REASON_INVALID_EQUIP_SLOT = 27;
  REJECT_REASON_INSUFFICIENT_ITEMS = 28;
  REJECT_REASON_INVENTORY_FULL = 29;
  REJECT_REASON_ITEM_GRADE_MISMATCH = 30;
  REJECT_REASON_ITEM_REUSE = 31;
  REJECT_REASON_INVALID_ENCHANT = 32;
  REJECT_REASON_INVALID_REFINEMENT = 33;
  REJECT_REASON_INVALID_RECIPE = 34;
  REJECT_REASON_ITEM_OPERATION_CONFLICT = 35;
  REJECT_REASON_ITEM_CAPABILITY_DEFERRED = 36;
  REJECT_REASON_CRYSTALLIZE_LEVEL_TOO_LOW = 37;
  // Phase 5 economy reasons (phase-5-zone-design.md §13.1). This EXTENDS the enum (E20).
  REJECT_REASON_GROUND_ITEM_NOT_FOUND = 38;
  REJECT_REASON_GROUND_ITEM_PROTECTED = 39; // DropProtection or loot owner
  REJECT_REASON_INVALID_MERCHANT = 40; // not a merchant/keeper/manager, or list not allowed
  REJECT_REASON_INVALID_QUANTITY = 41;
  REJECT_REASON_VENDOR_OUT_OF_STOCK = 42;
  REJECT_REASON_ADENA_LIMIT = 43; // MaxAdena / price overflow guards
  REJECT_REASON_WEIGHT_LIMIT = 44;
  REJECT_REASON_INSUFFICIENT_ADENA = 45;
  REJECT_REASON_ITEM_NOT_SELLABLE = 46;
  REJECT_REASON_ITEM_COUNT_CAP = 47; // D68/D70 receiver cap
  REJECT_REASON_RECIPE_ALREADY_REGISTERED = 48;
  REJECT_REASON_RECIPE_BOOK_FULL = 49;
  REJECT_REASON_CRAFT_SKILL_MISSING = 50;
  REJECT_REASON_CRAFT_LEVEL_TOO_LOW = 51;
  REJECT_REASON_MISSING_MATERIALS = 52;
  REJECT_REASON_IN_COMBAT = 53;
  REJECT_REASON_NO_PENDING_REQUEST = 54;
  REJECT_REASON_ALREADY_TRADING = 55;
  REJECT_REASON_TARGET_BUSY = 56;
  REJECT_REASON_CANNOT_TRADE_IN_STORE = 57;
  REJECT_REASON_CANNOT_ADJUST_AFTER_CONFIRM = 58;
  REJECT_REASON_ITEM_NOT_TRADABLE = 59;
  REJECT_REASON_STORE_SLOT_LIMIT = 60;
  REJECT_REASON_STORE_NOT_OPEN = 61;
  REJECT_REASON_PACKAGE_INCOMPLETE = 62;
  REJECT_REASON_PRICE_MISMATCH = 63;
  REJECT_REASON_PARTY_FULL = 64;
  REJECT_REASON_PARTY_ALREADY_IN_PARTY = 65;
  REJECT_REASON_NOT_PARTY_LEADER = 66;
  REJECT_REASON_NOT_PARTY_MEMBER = 67;
  REJECT_REASON_PARTY_LOOT_VOTE_IN_PROGRESS = 68;
  REJECT_REASON_CONTAINER_BUSY = 69; // lease held (retryable)
  REJECT_REASON_WAREHOUSE_FULL = 70;
  REJECT_REASON_ITEM_NOT_DEPOSITABLE = 71;
  REJECT_REASON_FREIGHT_TARGET_INVALID = 72;
  REJECT_REASON_ITEM_NOT_FREIGHTABLE = 73;
  REJECT_REASON_FREIGHT_FULL = 74;
  REJECT_REASON_PEACE_ZONE_REQUIRED = 75;
  REJECT_REASON_MAIL_ATTACHMENTS_EXCEEDED = 76;
  REJECT_REASON_MAIL_RECEIVER_NOT_FOUND = 77;
  REJECT_REASON_MAILBOX_FULL = 78;
  REJECT_REASON_MAIL_NOT_FOUND = 79; // absent, expired, or not the actor's
  REJECT_REASON_MAIL_ALREADY_TAKEN = 80;
  REJECT_REASON_SWEEP_NOT_ALLOWED = 81; // not spoiler/party, old corpse, not spoiled
  REJECT_REASON_NOT_SEEDABLE = 82; // Seed handler failures incl. wrong castle area
  REJECT_REASON_HARVEST_NOT_ALLOWED = 83;
  REJECT_REASON_MANOR_UNAVAILABLE = 84;
  REJECT_REASON_AUCTION_NOT_ACTIVE = 85;
  REJECT_REASON_BID_TOO_LOW = 86;
  REJECT_REASON_BID_TOO_HIGH = 87; // > 100,000,000,000
  REJECT_REASON_NO_BID_TO_CANCEL = 88;
}

message WorldEvent {
  oneof event {
    EntitySpawn spawn = 1;
    EntityMove move = 2;
    EntityDespawn despawn = 3;
    AttackResult attack_result = 4; // authoritative combat fact
    EntityDied entity_died = 5; // authoritative combat fact
    EntityRespawned entity_respawned = 6; // authoritative combat fact
    StatsChanged stats_changed = 7; // authoritative combat fact
    XpGained xp_gained = 8; // authoritative combat fact
    LevelUp level_up = 9; // authoritative combat fact
    TargetChanged target_changed = 10; // authoritative combat fact
    AttackStarted attack_started = 11; // a swing started; lands at impact_tick
    AttackCancelled attack_cancelled = 12; // a pending swing ended without impact
    ClassChanged class_changed = 13;
    SkillCastStarted skill_cast_started = 14;
    SkillCastResult skill_cast_result = 15;
    SkillCastCancelled skill_cast_cancelled = 16;
    EffectApplied effect_applied = 17;
    EffectRemoved effect_removed = 18;
    SkillReuse skill_reuse = 19;
    SkillLearned skill_learned = 20;
    PvpStateChanged pvp_state_changed = 21;
    ResurrectOffer resurrect_offer = 22;
    SpGained sp_gained = 23;
    SkillStateSync skill_state_sync = 24;
    VitalsChanged vitals_changed = 25;
    InventorySync inventory_sync = 26;
    InventoryChanged inventory_changed = 27;
    EquipmentChanged equipment_changed = 28;
    WeightChanged weight_changed = 29;
    PenaltyChanged penalty_changed = 30;
    EnchantResult enchant_result = 31;
    RefineResult refine_result = 32;
    ItemOperationResult item_operation_result = 33;
    // Phase 5 economy events (economy.proto; phase-5-zone-design.md §13.1).
    EconomyResult economy_result = 34; // owner-only frozen receipt
    CorpseStateChanged corpse_state_changed = 35; // public
    PartyStateChanged party_state_changed = 36; // party members
    PartyLootVote party_loot_vote = 37; // party members
    PartyInviteReceived party_invite_received = 38; // invite target
    TradeRequestReceived trade_request_received = 39; // trade target
    TradeSessionChanged trade_session_changed = 40; // both participants
    PrivateStoreChanged private_store_changed = 41; // AOI
    MailNotification mail_notification = 42; // receiver; sent by the API gateway, never zone output
    RecipeBookSync recipe_book_sync = 43; // owner baseline/delta
    ItemAuctionStatusChanged item_auction_status_changed = 44; // bidders + auctioneer AOI
    LootDistributed loot_distributed = 45; // party members except recipient
  }
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
  ENTITY_KIND_GROUND_ITEM = 3; // Phase 5 (B5): an entity that carries one item instance
}

// An entity entered the receiving session's area of interest (or the zone, or was replaced).
message EntitySpawn {
  string entity_id = 1;
  string name = 2;
  Position position = 3;
  EntityKind kind = 4;
  // Generation of the account session that owns this entity. A new admission for an account
  // bumps it; a spawn with a higher generation replaces any earlier entity of that account,
  // and anything stamped with a lower generation is stale and must be discarded.
  uint32 session_generation = 5;
  // Combat state for AOI entry (absent fields = noncombat entity): public HP, life and any
  // swing already in flight. MP and XP are owner-only (StatsChanged / XpGained).
  bool combatant = 6;                   // true when the fields below are meaningful
  string template_id = 7;               // NPC template; empty for players
  uint32 life_incarnation = 8;          // NPC life counter; a respawn increments it
  bool dead = 9;
  bool attackable = 10;                 // the receiver may SetTarget it
  uint32 hp = 11;
  uint32 max_hp = 12;
  uint32 level = 13;
  AttackStarted pending_swing = 14;     // legacy only; V5 hydrates after all identities
  Race race = 15;
  uint32 class_id = 16;
  Sex sex = 17;
  uint32 hair_style = 18;
  uint32 hair_color = 19;
  uint32 face = 20;
  uint64 state_tick = 21;
  uint64 flag_until_tick = 22; // public; zero means unflagged
  uint32 karma = 23; // public; chaotic when positive
  repeated ActiveEffect active_effects = 24; // reserved baseline shape; empty in V5 identities
  SkillCastStarted pending_cast = 25; // absent in V5 identities; hydrate after all spawns
  uint32 pk_count = 26;
  uint32 pvp_count = 27;
  uint64 status_flags = 28; // public status bits; no death-penalty modifier disclosure
  repeated VisibleEquipment visible_equipment = 29;
  GroundItemDetail ground_item = 30; // Phase 5: present iff kind == ENTITY_KIND_GROUND_ITEM
}

message EntityMove {
  string entity_id = 1;
  Position position = 2;                // where the entity is at server_time_ms
  Position destination = 3;             // where it is heading (zero when stopped)
  float speed = 4;                      // tiles per second
  int64 server_time_ms = 5;             // authoritative timestamp for interpolation;
                                        // = time_origin_ms + tick * 100
  uint64 tick = 6;                      // zone tick this state is valid at
}

message EntityDespawn {
  string entity_id = 1;
}

// Physical attack outcome; a miss consumes no crit or damage-spread roll.
enum AttackOutcome {
  ATTACK_OUTCOME_UNSPECIFIED = 0;
  ATTACK_OUTCOME_MISS = 1;
  ATTACK_OUTCOME_HIT = 2;
  ATTACK_OUTCOME_CRIT = 3;
}

// Authoritative attack result fact; responses precede facts, spawns precede references.
message AttackResult {
  string attacker = 1; // attacker UUID
  string target = 2; // target UUID
  uint64 tick = 3; // impact tick; 100 ms per tick
  AttackOutcome outcome = 4; // MISS, HIT or CRIT; UNSPECIFIED is invalid
  uint32 damage = 5; // whole HP removed; zero on MISS
  uint32 target_hp_after = 6; // authoritative remaining whole HP after impact
  uint32 target_incarnation = 7; // the target life the swing landed on
  uint32 cp_damage = 8; // CP absorbed; damage retains whole HP removed meaning
}

// Authoritative entity died fact; responses precede facts, spawns precede references.
message EntityDied {
  string entity = 1; // dead entity UUID
  uint64 tick = 2; // death tick
  string killer = 3; // killing entity UUID; empty if no killer
  uint32 incarnation = 4; // the life that ended
}

// A swing started at `tick`; it lands at `impact_tick` unless an AttackCancelled follows,
// and the attacker's next swing may start at `ready_tick`. Animations wind up before impact.
message AttackStarted {
  string attacker = 1;
  string target = 2; // V5 hidden endpoint: empty together with target_incarnation=0
  uint64 tick = 3;
  uint64 impact_tick = 4;
  uint64 ready_tick = 5;
  uint32 target_incarnation = 6;
  bool baseline = 7; // V5 swing hydration; no animation/transition count
  uint64 baseline_tick = 8;
  optional uint32 attacker_incarnation = 9;
}

enum SwingCancelReason {
  SWING_CANCEL_REASON_UNSPECIFIED = 0;
  SWING_CANCEL_REASON_STOPPED = 1;        // StopAttack
  SWING_CANCEL_REASON_TARGET_CHANGED = 2; // selection changed or cleared
  SWING_CANCEL_REASON_MOVED = 3;          // MoveTo / StopMove
  SWING_CANCEL_REASON_OUT_OF_RANGE = 4;   // target outside reach at impact
  SWING_CANCEL_REASON_TARGET_LOST = 5;    // target died, left or became protected
  SWING_CANCEL_REASON_ATTACKER_DIED = 6;  // attacker died or left
}

// A pending swing ended without an impact; no damage, no roll.
message AttackCancelled {
  string attacker = 1;
  string target = 2;
  uint64 tick = 3;
  SwingCancelReason reason = 4;
}

// Authoritative entity respawned fact; responses precede facts, spawns precede references.
message EntityRespawned {
  string entity = 1; // respawned entity UUID
  uint64 tick = 2; // respawn tick
  Position position = 3; // authoritative safe point in tile units
  uint32 hp = 4; // restored whole HP
  uint32 incarnation = 5; // the new life; facts about older lives are stale
}

// Authoritative stats changed fact; responses precede facts, spawns precede references.
message StatsChanged {
  string entity = 1; // owner UUID; this event is owner-only (MP is private)
  uint32 hp = 2; // current whole HP, zero when dead
  uint32 max_hp = 3; // maximum whole HP
  uint32 mp = 4; // current whole MP
  uint32 max_mp = 5; // maximum whole MP
  uint32 level = 6; // current level, including decreases after death
  uint64 xp = 7; // cumulative whole XP, including death loss (owner-only)
  uint32 cp = 8;
  uint32 max_cp = 9;
  uint32 class_id = 10;
  uint64 sp = 11;
  uint32 token_tier_1_count = 12;
  uint32 token_tier_2_count = 13;
  uint64 tick = 14;
  uint32 karma = 15; // owner copy; public projection uses PvpStateChanged
  uint32 pk_count = 16;
  uint32 pvp_count = 17;
  uint64 flag_until_tick = 18;
  uint32 death_penalty_level = 19; // private, 0..5
  EffectiveStats effective_stats = 20;
  bool baseline = 21; // admission/replacement owner update accepted at baseline_tick
  uint64 baseline_tick = 22;
  uint32 incarnation = 23;
  ItemWeightState item_weight = 24;
  ItemPenaltyState item_penalties = 25;
  uint64 inventory_revision = 26;
}

// Authoritative xp gained fact; responses precede facts, spawns precede references.
message XpGained {
  string entity = 1; // owner UUID; this event is owner-only
  uint64 amount = 2; // whole XP actually awarded after the level-85 cap
  uint64 total = 3; // authoritative cumulative whole XP after award
}

// Authoritative level up fact; responses precede facts, spawns precede references.
message LevelUp {
  string entity = 1; // levelled entity UUID
  uint32 level = 2; // newly attained level; one event per crossed threshold
}

// Authoritative target changed fact; responses precede facts, spawns precede references.
message TargetChanged {
  string entity = 1; // selecting actor UUID; owner-only
  string target = 2; // selected target UUID; empty means cleared or not visible/known
  bool baseline = 3; // owner admission/replacement selection, accepted at baseline_tick
  uint64 baseline_tick = 4;
  optional uint32 target_incarnation = 5;
  uint64 tick = 6; // V5 fact tick; legacy encodes zero/absent. Baselines are accepted at
                   // tick=baseline_tick; ordinary deltas require tick > the identity baseline.
}

// Authoritative class change visible to the character's area of interest.
message ClassChanged {
  string entity = 1;
  uint32 class_id = 2;
  uint64 tick = 3;
  uint32 session_generation = 4;
}

// All optional entity/incarnation pairs are omitted together unless visible and known
// AFTER the full identity batch. Private replay keeps attribution. Baselines upsert stable
// ids/deadlines without animations, and are accepted at baseline_tick. Ordinary deltas at or
// before that tick cannot overwrite a baseline. Death Penalty effects are never public.
message ActiveEffect {
  uint32 skill_id = 1;
  uint32 skill_level = 2;
  uint64 remaining_ticks = 3;
  bool is_debuff = 4;
  optional string caster = 5;
  uint64 effect_id = 6;
  optional uint32 caster_incarnation = 7;
  uint32 target_incarnation = 8;
}

// Public to caster owner and observers; absent target preserves the caster's summary.
message SkillCastStarted {
  string caster = 1;
  optional string target = 2;
  uint32 skill_id = 3;
  uint32 skill_level = 4;
  uint64 cast_id = 5;
  uint64 tick = 6;
  uint64 complete_tick = 7;
  uint32 caster_incarnation = 8;
  optional uint32 target_incarnation = 9;
  bool baseline = 10;
  uint64 baseline_tick = 11;
  uint64 launch_tick = 12;
  uint64 start_tick = 13; // original cast start; tick is the delivery/fact tick during hydration
}

enum SkillResolutionKind {
  SKILL_RESOLUTION_KIND_UNSPECIFIED = 0;
  SKILL_RESOLUTION_KIND_PHYSICAL = 1;
  SKILL_RESOLUTION_KIND_MAGICAL = 2;
  SKILL_RESOLUTION_KIND_EFFECT = 3;
  SKILL_RESOLUTION_KIND_HEAL = 4;
  SKILL_RESOLUTION_KIND_RESURRECTION = 5;
}

enum SkillOutcome {
  SKILL_OUTCOME_UNSPECIFIED = 0;
  SKILL_OUTCOME_MISS = 1;
  SKILL_OUTCOME_HIT = 2;
  SKILL_OUTCOME_CRIT = 3;
  SKILL_OUTCOME_RESIST = 4;
  SKILL_OUTCOME_HALF = 5;
}

// Canonical target order, filtered per observer AOI. CP total and MP remain private.
message SkillTargetResult {
  string target = 1;
  uint32 target_incarnation = 2;
  uint64 tick = 3;
  SkillResolutionKind resolution_kind = 4;
  uint32 rolled = 5; // whole pre-absorption damage, not HP subtraction
  uint32 cp_absorbed = 6; // whole CP removed, same meaning as AttackResult.cp_damage
  uint32 hp_removed = 7;
  uint32 heal = 8; // actual HP restored
  SkillOutcome outcome = 9;
  uint32 target_hp_after = 10;
  repeated uint64 applied_effect_ids = 11;
}

// Public caster-visible fact; hidden target rows are omitted without changing order.
message SkillCastResult {
  string caster = 1;
  uint32 caster_incarnation = 2;
  uint64 cast_id = 3;
  uint64 tick = 4;
  uint32 skill_id = 5;
  uint32 skill_level = 6;
  repeated SkillTargetResult targets = 7;
  optional uint64 effect_id = 8;
}

enum CastCancelReason {
  CAST_CANCEL_REASON_UNSPECIFIED = 0;
  CAST_CANCEL_REASON_STOPPED = 1;
  CAST_CANCEL_REASON_MOVED = 2;
  CAST_CANCEL_REASON_DAMAGE = 3;
  CAST_CANCEL_REASON_INCAPACITATED = 4;
  CAST_CANCEL_REASON_TARGET_LOST = 5;
  CAST_CANCEL_REASON_OUT_OF_RANGE = 6;
  CAST_CANCEL_REASON_RESOURCES = 7;
  CAST_CANCEL_REASON_CASTER_DIED = 8;
  CAST_CANCEL_REASON_PEACE_ZONE = 9;
  CAST_CANCEL_REASON_TRANSFER = 10;
}

// Same audience as SkillCastStarted; cancellation never refunds MP1 or reuse.
message SkillCastCancelled {
  string caster = 1;
  uint64 cast_id = 2;
  CastCancelReason reason = 3;
  uint64 tick = 4;
  uint32 caster_incarnation = 5;
}

enum EffectPool {
  EFFECT_POOL_UNSPECIFIED = 0;
  EFFECT_POOL_BUFF = 1;
  EFFECT_POOL_SONG_DANCE = 2;
  EFFECT_POOL_DEBUFF = 3;
}

// Public target-owner/observer summary. Hidden sources are omitted; subject survives.
message EffectApplied {
  string target = 1;
  uint32 target_incarnation = 2;
  optional string caster = 3;
  optional uint32 caster_incarnation = 4;
  uint64 effect_id = 5;
  uint32 skill_id = 6;
  uint32 skill_level = 7;
  EffectPool pool = 8;
  uint64 tick = 9;
  uint64 end_tick = 10; // zero only for a supported permanent effect; death penalty stays private
  string abnormal_type = 11;
  uint32 abnormal_level = 12;
  uint64 status_flags = 13;
  bool baseline = 14;
  uint64 baseline_tick = 15;
  uint64 applied_tick = 16; // original application; tick is the delivery/fact tick
}

enum EffectRemoveReason {
  EFFECT_REMOVE_REASON_UNSPECIFIED = 0;
  EFFECT_REMOVE_REASON_EXPIRED = 1;
  EFFECT_REMOVE_REASON_REPLACED = 2;
  EFFECT_REMOVE_REASON_OVERFLOW = 3;
  EFFECT_REMOVE_REASON_DISPELLED = 4;
  EFFECT_REMOVE_REASON_DAMAGE = 5;
  EFFECT_REMOVE_REASON_DEATH = 6;
  EFFECT_REMOVE_REASON_TRANSFER = 7;
}

// Same audience as EffectApplied.
message EffectRemoved {
  string target = 1;
  uint32 target_incarnation = 2;
  uint64 effect_id = 3;
  EffectRemoveReason reason = 4;
  uint64 tick = 5;
}

// Owner only. Zero ready_tick means ready; admission uses SkillStateSync.
message SkillReuse {
  string entity = 1;
  uint32 skill_id = 2;
  uint64 ready_tick = 3;
  uint64 tick = 4;
  uint32 incarnation = 5;
}

// Owner only; emitted after durable log + fenced checkpoint, like LearnSkill RPC success.
message SkillLearned {
  string entity = 1;
  uint32 skill_id = 2;
  uint32 skill_level = 3;
  uint64 sp_cost = 4;
  uint64 sp_remaining = 5;
  string idempotency_key = 6;
  uint64 tick = 7;
  uint32 incarnation = 8;
}

// Public to owner and observers knowing this incarnation; counters are public here.
message PvpStateChanged {
  string entity = 1;
  uint64 flag_until_tick = 2;
  uint32 karma = 3;
  uint32 pk_count = 4;
  uint32 pvp_count = 5;
  uint64 tick = 6;
  uint32 incarnation = 7;
  bool baseline = 8;
  uint64 baseline_tick = 9;
}

enum ResurrectOfferState {
  RESURRECT_OFFER_STATE_UNSPECIFIED = 0;
  RESURRECT_OFFER_STATE_OFFERED = 1;
  RESURRECT_OFFER_STATE_DECLINED = 2;
  RESURRECT_OFFER_STATE_EXPIRED = 3;
  RESURRECT_OFFER_STATE_ACCEPTED = 4;
}

// Target owner only, including off-AOI source (omit source pair in that case).
message ResurrectOffer {
  string target = 1;
  uint32 target_incarnation = 2;
  uint64 offer_id = 3;
  optional string caster = 4;
  optional uint32 caster_incarnation = 5;
  int64 restore_percent_q = 6; // Q=1,000,000; nonnegative percent, no float rounding
  uint64 recoverable_xp = 7;
  uint64 expiry_tick = 8;
  ResurrectOfferState state = 9;
  uint64 tick = 10;
  // Retained owner offer on identity hydration/replacement; upsert without a new-offer
  // transition. Accept at tick == baseline_tick == the target identity state_tick.
  // Ordinary offer lifecycle deltas require tick > the identity baseline.
  bool baseline = 11;
  uint64 baseline_tick = 12;
}

// Owner only; actual credited SP after signed-bigint cap, not requested reward.
message SpGained {
  string entity = 1;
  uint64 amount = 2;
  uint64 total = 3;
  uint64 tick = 4;
  uint32 incarnation = 5;
}

message LearnedSkillRank {
  uint32 skill_id = 1;
  uint32 skill_level = 2;
}

message SkillReuseState {
  uint32 skill_id = 1;
  uint64 ready_tick = 2;
}

// Owner only admission/replacement baseline; never filtered as an ordinary same-tick delta.
message SkillStateSync {
  string entity = 1;
  repeated LearnedSkillRank learned = 2;
  repeated SkillReuseState reuse = 3;
  uint64 sp = 4;
  uint32 karma = 5;
  uint32 pk_count = 6;
  uint32 pvp_count = 7;
  uint64 flag_until_tick = 8;
  uint32 death_penalty_level = 9;
  uint64 tick = 10;
  uint32 incarnation = 11;
  bool baseline = 12;
  uint64 baseline_tick = 13;
}

// Public final HP/maxHP pair after same-tick facts, including max-only changes.
// For an already-visible new incarnation, follows EntityRespawned with baseline=true;
// suppress only when that observer actually received a final HP/maxHP identity baseline.
message VitalsChanged {
  string entity = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
  uint64 tick = 4;
  uint32 incarnation = 5;
  bool baseline = 6;
  uint64 baseline_tick = 7;
}
