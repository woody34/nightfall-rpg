# PvP and Karma constants from the pinned L2J High Five source (packages/data/SOURCES.md).
# Formulas.java lines 1814-1860 and pcKarmaIncrease.xml lines 3-87.
# Item drop rules on chaotic death are NOT included (Phase 3 owns no item loss on death).

source_game = { repository = "https://bitbucket.org/l2jserver/l2j-server-game", revision = "abfde0490ac52a2106e884b7242c0276c44cdf76", file = "src/main/java/com/l2jserver/gameserver/model/stats/Formulas.java" }
source_datapack = { repository = "https://bitbucket.org/l2jserver/l2j-server-datapack", revision = "3ca488dd2bd0bfaca43e378886a3c2e37968153a", file = "src/main/resources/data/stats/chars/pcKarmaIncrease.xml" }

[flags]
# Standard PvP flag duration: 1200 ticks (120 seconds at 100 ms/tick)
pvp_flag_ticks = 1200
# Low PvP flag duration when hitting an already flagged target: 600 ticks (60 seconds at 100 ms/tick)
pvp_flag_low_ticks = 600

[karma_gain]
# Default karma gain for pkCount >= 180 (Formulas.java line 1831)
base_gain = 43200
# Formulas.java lines 1841-1845
low_pk_count_threshold = 99
low_pk_count_multiplier = "0.5"
low_pk_count_scale = 720
mid_pk_count_threshold = 180
mid_pk_count_multiplier = "0.125"
mid_pk_count_base = "37.75"
mid_pk_count_scale = 720
# Formulas.java lines 1833-1839 (isSummon = true)
summon_multiplier = "0.375"
summon_scale = 240
summon_offset = 150
summon_max = 10800

[karma_lost]
# Formulas.java lines 1814-1821: (int) ((Math.abs(exp) / karmaLooseMul) / 30)
divisor = 30
rate_karma_lost = 1

