# Tasks inherited by every project using the rust toolchain.
$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  toolchains: ['rust']

fileGroups:
  sources:
    - 'src/**/*'
    - 'tests/**/*'
    - 'migrations/**/*'
    - 'build.rs'
    - 'Cargo.toml'
  standards:
    - '/Cargo.toml'
    - '/Cargo.lock'
    - '/rustfmt.toml'
    - '/clippy.toml'
    - '/deny.toml'

tasks:
  build:
    command: 'cargo build --all-targets'
    inputs:
      - '@group(sources)'
      - '@group(standards)'
  check:
    command: 'cargo check --all-targets'
    inputs:
      - '@group(sources)'
      - '@group(standards)'
  lint:
    command: 'cargo clippy --all-targets -- -D warnings'
    inputs:
      - '@group(sources)'
      - '@group(standards)'
  format:
    command: 'cargo fmt --all -- --check'
    inputs:
      - '@group(sources)'
      - '/rustfmt.toml'
  test:
    command: 'cargo test'
    inputs:
      - '@group(sources)'
      - '@group(standards)'
    env:
      # Adapter tests run when the compose services are up and skip otherwise.
      DATABASE_URL: 'postgres://nightfall:nightfall@localhost:5432/nightfall'
      NATS_URL: 'nats://localhost:4222'
  deny:
    command: 'cargo deny check'
    inputs:
      - '/Cargo.lock'
      - '/deny.toml'
