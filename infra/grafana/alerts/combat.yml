# E6.2: live TickStats include durable admission latency.
apiVersion: 1
groups:
- orgId: 1
  name: nightfall-combat-dev
  folder: Nightfall
  interval: 30s
  rules:
  - uid: nf-combat-tick-p99-high
    title: Combat tick p99 above 50 ms
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: dev
      service: nightfall-api
    annotations:
      summary: Combat tick p99 is {{ printf "%.3f" $values.B.Value }} s
      description: The 100 ms tick budget is at risk. p99 over 5 m exceeded 50 ms.
    dashboardUid: nightfall-api
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.99, sum by (le) (rate(nightfall_combat_tick_duration_seconds_bucket[5m])))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.05
