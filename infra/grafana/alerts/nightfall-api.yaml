# Dev alert rules, provisioned into the LGTM container by docker-compose.yml.
# Thresholds mirror docs/plans/phase-0b-connected-slice.md Story 5.3.
apiVersion: 1
groups:
- orgId: 1
  name: nightfall-api-dev
  folder: Nightfall
  interval: 30s
  rules:
  - uid: nf-tick-p99-high
    title: Tick p99 above 50 ms
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: dev
      service: nightfall-api
    annotations:
      summary: Tick p99 is {{ printf "%.3f" $values.B.Value }} s
      description: The 100 ms tick budget is at risk. p99 over 5 m exceeded 50 ms.
    dashboardUid: nightfall-api
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: histogram_quantile(0.99, sum by (le) (rate(nightfall_tick_duration_seconds_bucket[5m])))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.05
  - uid: nf-ws-dropped-frames
    title: WebSocket frames dropped
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: dev
      service: nightfall-api
    annotations:
      summary: '{{ $values.B.Value }} frames dropped in 5 m'
      description: A client send queue overflowed. Frames must never be dropped silently; check the slow
        session.
    dashboardUid: nightfall-api
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(increase(nightfall_ws_dropped_frames_total[5m]))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: nf-outbox-lag-high
    title: Outbox lag above 30 s
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: dev
      service: nightfall-api
    annotations:
      summary: Oldest unpublished outbox row is {{ $values.B.Value }} s old
      description: The outbox relay is stalled or behind; events are staged but not reaching NATS.
    dashboardUid: nightfall-api
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(nightfall_outbox_lag_seconds)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 30
  - uid: nf-zone-paused
    title: Zone paused (replay log unavailable)
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: dev
      service: nightfall-api
    annotations:
      summary: '{{ $values.B.Value }} zone(s) paused'
      description: A zone could not get its tick records acknowledged by JetStream for longer than
        the gate's max stall, so it stopped advancing and refuses inputs as OVERLOADED. Check NATS.
    dashboardUid: nightfall-api
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(nightfall_zones_paused)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
  - uid: nf-audit-dropped
    title: Session audit frames dropped
    condition: C
    for: 0s
    noDataState: OK
    execErrState: Error
    isPaused: false
    labels:
      severity: dev
      service: nightfall-api
    annotations:
      summary: '{{ $values.B.Value }} audit frames dropped in 5 m'
      description: The session audit log (NF_SESSIONS) fell behind or JetStream refused frames.
        Replay is unaffected (it uses the zone log), but the audit trail has a gap.
    dashboardUid: nightfall-api
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(increase(nightfall_eventlog_audit_dropped_total[5m]))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
