# cargo-deny configuration: supply-chain policy as code. Run `cargo deny check` (install with
# `cargo install cargo-deny`). CI runs it on every pull request.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "openssl", reason = "rustls everywhere so the binary has no system TLS dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
