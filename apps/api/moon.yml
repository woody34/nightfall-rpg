$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
stack: 'backend'
toolchains:
  default: 'rust'

project:
  title: 'api'
  description: 'Nightfall game server: axum HTTP + tonic gRPC.'

dependsOn:
  - 'proto'

tasks:
  perf-check:
    command: 'cargo test -p nightfall-api --release combat_tick_p99_simulation -- --ignored --nocapture'
    description: 'Enforce the actor-only combat p99 budget; E6.2 also requires the production-path load measurement.'
    options:
      cache: false
      runInCI: false
  dev:
    command: 'cargo run -p nightfall-api'
    preset: 'server'
    options:
      envFile: '/.env'   # repo-root .env (copy from .env.example); missing file is fine
  entities:
    command: 'bash entities.sh'
    description: 'Regenerate SeaORM entities from the migrations (needs the compose Postgres).'
    inputs:
      - 'src/infrastructure/postgres/migrations/**/*'
      - 'entities.sh'
    options:
      cache: false
      runInCI: false
  entities-check:
    command: 'bash entities.sh --check'
    description: 'Fail if the committed entities differ from a fresh generation.'
    inputs:
      - 'src/infrastructure/postgres/migrations/**/*'
      - 'src/infrastructure/postgres/entities/**/*'
      - 'entities.sh'
    options:
      cache: false
  replay-check:
    command: 'bash fixtures/sessions/replay-check.sh'
    description: 'Replay movement and fight recordings; fails on any byte or state divergence.'
    inputs:
      - '@group(sources)'
      - '@group(standards)'
      - 'fixtures/sessions/**/*'
