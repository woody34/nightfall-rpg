$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
type: 'application'
tags: ['backend']

project:
  name: 'api'
  description: 'Nightfall game server: axum HTTP + tonic gRPC.'

dependsOn:
  - 'proto'

tasks:
  dev:
    command: 'cargo run -p nightfall-api'
    local: true
    options:
      persistent: true
