$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'rust'
layer: 'application'
stack: 'backend'
toolchains:
  default: 'rust'

project:
  title: 'api'
  description: 'Nightfall game server: axum HTTP + tonic gRPC.'

dependsOn:
  - 'proto'

tasks:
  dev:
    command: 'cargo run -p nightfall-api'
    preset: 'server'
    options:
      envFile: '/.env'   # repo-root .env (copy from .env.example); missing file is fine
  entities:
    command: 'bash entities.sh'
    description: 'Regenerate SeaORM entities from the migrations (needs the compose Postgres).'
    inputs:
      - 'src/infrastructure/postgres/migrations/**/*'
      - 'entities.sh'
    options:
      cache: false
      runInCI: false
  entities-check:
    command: 'bash entities.sh --check'
    description: 'Fail if the committed entities differ from a fresh generation.'
    inputs:
      - 'src/infrastructure/postgres/migrations/**/*'
      - 'src/infrastructure/postgres/entities/**/*'
      - 'entities.sh'
    options:
      cache: false
  replay-check:
    command: 'cargo run --quiet --bin nightfall-replay -- --source file --file fixtures/sessions/two-players-v4.nfr'
    description: 'Replay the checked-in two-player recording; fails on any output divergence.'
    inputs:
      - '@group(sources)'
      - '@group(standards)'
      - 'fixtures/sessions/**/*'
