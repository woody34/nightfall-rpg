$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'unknown'
layer: 'application'
stack: 'frontend'

project:
  title: 'client-unreal'
  description: 'Unreal Engine 5 thin client. Builds require UE_ROOT to point at an Unreal install.'

dependsOn:
  - 'proto'

# UE builds are driven by the engine's own tooling. These wrap it so `moon run client-unreal:build`
# works on a machine with the engine installed. They are not run in CI (no engine there yet).
tasks:
  # Submodule, TurboLink's prebuilt gRPC/protobuf libraries (~900 MB, cached) and the links that
  # compile Source/Nightfall/Generated inside the TurboLinkGrpc module. Fast when already done.
  setup:
    command: 'bash Scripts/setup-turbolink.sh'
    preset: 'utility'
  build-editor:
    command: 'bash -c "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh NightfallEditor Linux Development -Project=$PWD/Nightfall.uproject -WaitMutex"'
    deps: ['~:setup']
    preset: 'utility'
  build:
    command: 'bash -c "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh Nightfall Linux Development -Project=$PWD/Nightfall.uproject -WaitMutex"'
    deps: ['~:setup']
    preset: 'utility'
  # Headless automation tests (ProductFilter only, so `Nightfall` selects just ours). The live ones
  # (Nightfall.*.EndToEnd, Nightfall.Net.SessionClient.Ping) need the API running (api:dev) and skip
  # with a warning without it. CI mode: `moon run client-unreal:test-editor -- --require-live-api`
  # (also on when CI=true) turns that skip into a failure so a down server never shows green.
  test-editor:
    command: 'bash Scripts/run-tests.sh'
    deps: ['~:build-editor']
    preset: 'utility'
  # Headless bot simulation (Phase 1a). Runs scenario files through the Nightfall game binary, copies
  # Saved/Sim output and the session recording to Saved/SimArtifacts/<timestamp>, replay-checks each
  # recording, exits non-zero on any failure. Builds the game target itself when stale.
  #   moon run client-unreal:sim -- Scenarios/0b-login-enter-world.nfs
  #   moon run client-unreal:sim -- 'Scenarios/1-*.nfs' --api start --artifacts /tmp/sim
  # Default `--api attach` needs the API up (api:dev with AUTH_DEV_TOKENS=1); `--api start` starts
  # the compose stack and the API itself. Multi-client groups: `bash Scripts/run-sim-multi.sh`.
  sim:
    command: 'bash Scripts/run-sim.sh'
    preset: 'utility'
  # Every scenario under Scenarios/, sequentially. Extra args (e.g. `-- --api start`) are appended.
  sim-all:
    command: 'bash Scripts/run-sim.sh'
    args: ['Scenarios/*.nfs']
    preset: 'utility'
  # Regenerates Content/{Input,Blueprints,UI,Maps} headless from Scripts/create_content.py.
  create-content:
    command: 'bash Scripts/create-content.sh'
    deps: ['~:build-editor']
    preset: 'utility'
  # Imports the owner's Fab downloads (Vendor/Downloads) and the engine's template Manny into
  # Content/Vendor (git-ignored) headless with Scripts/import_vendor.py. Repeatable; see
  # THIRD_PARTY_ASSETS.md and the README "Art and animation".
  import-vendor:
    command: 'bash Scripts/import-vendor.sh'
    deps: ['~:build-editor']
    preset: 'utility'
  # Two scripted game clients against a running API with AUTH_DEV_TOKENS=1 (GRPC=host:port, default
  # localhost:50051): kill -> XP and death -> respawn with the animated proxies.
  playtest:
    command: 'bash Scripts/playtest.sh'
    deps: ['~:build-editor']
    preset: 'utility'
  editor:
    command: 'bash -c "$UE_ROOT/Engine/Binaries/Linux/UnrealEditor $PWD/Nightfall.uproject"'
    preset: 'server'
  # Regenerates Source/Nightfall/Generated from packages/proto with protoc-gen-turbolink. Builds
  # the Linux generator tools on first use (Scripts/install-proto-tools.sh, ~10 minutes once).
  gen-proto:
    command: 'bash Scripts/gen-proto.sh'
    inputs:
      - '/packages/proto/**/*.proto'
      - 'Scripts/gen-proto.sh'
      - 'Scripts/install-proto-tools.sh'
    outputs:
      - 'Source/Nightfall/Generated/Public'
      - 'Source/Nightfall/Generated/Private'
    preset: 'utility'
