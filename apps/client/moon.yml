$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'
layer: 'application'
stack: 'frontend'
toolchains:
  default: 'node'

project:
  title: 'client'
  description: 'Low-fidelity Phaser client for Nightfall.'

dependsOn:
  - 'proto'

tasks:
  dev:
    command: 'vite'
    preset: 'server'
  build:
    command: 'vite build'
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'index.html'
      - 'public/**/*'
    outputs:
      - 'dist'
  preview:
    command: 'vite preview'
    preset: 'server'
    deps:
      - 'build'
